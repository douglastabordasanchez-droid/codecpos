<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Gestiona tu negocio CODEC POS desde el celular" />
    <meta name="author" content="Codec Studio" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- iPhone: abrir como app (sin barra de Safari) al agregarla a la pantalla de inicio; requisito para las notificaciones push en iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Codec POS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CODEC POS</title>
    <script>
      // Tras publicar una versión, el celular podía abrir la página vieja
      // guardada, que pedía archivos que ya no existen: pantalla en blanco.
      // Si un archivo de la app no carga, se limpia la caché y se recarga
      // una sola vez (la marca evita recargar en bucle sin internet).
      (function () {
        var MARCA = 'codec_pwa_recargada';
        function recuperar() {
          try { if (sessionStorage.getItem(MARCA)) return; sessionStorage.setItem(MARCA, '1'); } catch (e) { return; }
          var tareas = [];
          if (navigator.serviceWorker) tareas.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) tareas.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(tareas).catch(function () {}).then(function () { location.reload(); });
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/assets\//.test(t.src || t.href || '')) recuperar();
        }, true);
        window.addEventListener('vite:preloadError', function () { recuperar(); });
        window.addEventListener('load', function () {
          setTimeout(function () { try { sessionStorage.removeItem(MARCA); } catch (e) {} }, 15000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pwa/main.tsx"></script>
  </body>
</html>
