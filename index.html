<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Punto de Venta Profesional" />
    <meta name="author" content="Codec Studio" />
    
    <!-- SEO y Meta Tags -->
    <title>CODEC POS v2.0 - Sistema Punto de Venta</title>
    
    <!-- Electron CSP (Content Security Policy) -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;
      script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
      style-src 'self' 'unsafe-inline' blob:;
      img-src 'self' data: blob: https:;
      font-src 'self' data: blob:;
      connect-src 'self' ws: wss: http: https:;
      worker-src 'self' blob:;
    ">
    
    <link rel="stylesheet" href="/loading-screen.css" />
  </head>
  <body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
      <div class="loading-content">
        <div class="loading-logo">CP</div>
        <div class="loading-text">CODEC POS v2.0</div>
        <div class="loading-subtext">Iniciando sistema...</div>
        <div class="loading-spinner"></div>
      </div>
    </div>
    
    <!-- React App Container -->
    <div id="root"></div>
    
    <!-- React Entry Point -->
    <script type="module" src="/src/index.tsx"></script>
    
    <!-- Ocultar loading cuando React cargue -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loading = document.getElementById('loading-screen');
          if (loading) {
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.5s ease';
            setTimeout(() => loading.remove(), 500);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
